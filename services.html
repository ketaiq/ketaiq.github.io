---
layout: default
title: "Ketai Qiu's services"
---
<main>
    <div class="container custom-main">
        <h2>Services</h2>
        {% for iteritem in site.services %}
        <div class="card my-3">
            <div class="card-body">
                <div class="card-title fs-5">
                    {{ iteritem.title }}
                </div>
                <ul class="mb-0">
                    {% for venue in iteritem.venues %}
                    <li>{{ venue }}</li>
                    {% endfor %}
                </ul>
            </div>
        </div>
        {% endfor %}
    </div>
</main>
